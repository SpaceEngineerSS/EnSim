[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ensim"
version = "4.0.0"
description = "Liquid rocket engine analysis and six-degree-of-freedom flight simulation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mehmet Gümüş"}]
maintainers = [{name = "Mehmet Gümüş"}]
keywords = [
    "rocket",
    "propulsion",
    "simulation",
    "aerospace",
    "thermodynamics",
    "NASA CEA",
    "chemical equilibrium",
    "flight dynamics",
    "6-DOF",
    "Monte Carlo",
    "nozzle design",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10"
# The library needs only the numerical stack. The desktop application is the
# "gui" extra: pip install "ensim[gui]".
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.59,<0.63; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "numba>=0.59; platform_system != 'Darwin' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.5",
    "matplotlib>=3.7",
    "pyvista>=0.40",
    "pyvistaqt>=0.11",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.1.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
all = ["ensim[gui,dev,docs]"]

[project.urls]
Homepage = "https://github.com/SpaceEngineerSS/EnSim"
Documentation = "https://spaceengineerss.github.io/EnSim/"
Repository = "https://github.com/SpaceEngineerSS/EnSim"
Issues = "https://github.com/SpaceEngineerSS/EnSim/issues"
Changelog = "https://github.com/SpaceEngineerSS/EnSim/blob/main/CHANGELOG.md"

[project.scripts]
ensim = "ensim.cli:main"

[project.gui-scripts]
ensim-gui = "ensim.cli:gui_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ensim*"]

[tool.setuptools.package-data]
ensim = [
    "py.typed",
    "data/*.dat",
    "assets/*.png",
    "assets/*.svg",
    "assets/*.ico",
    "assets/*.icns",
    "assets/fonts/*.ttf",
    "assets/fonts/*.txt",
    "assets/icons/*.svg",
    "assets/styles/*.qss",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "site",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "B008", "C901", "ARG001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "-q", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "validation: marks tests against external references",
    "gui: marks tests that require Qt",
]
filterwarnings = [
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning:pyparsing",
]

[tool.coverage.run]
source = ["ensim"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
