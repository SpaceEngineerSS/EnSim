name: Scientific issue
description: Report a model, unit or reference discrepancy
title: "[Science]: "
labels: [science, validation]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Equation or implementation
        - External reference discrepancy
        - Units or convention
        - Model-domain limitation
        - Thermodynamic data
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Complete inputs
      description: Include values, units, phases, conventions and EnSim version.
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: EnSim and reference results
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Primary source and reproduction method
    validations:
      required: true
