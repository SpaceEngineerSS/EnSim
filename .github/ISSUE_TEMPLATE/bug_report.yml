name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include exact inputs, units and the smallest sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or log
      render: shell
  - type: input
    id: version
    attributes:
      label: EnSim version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and operating system
    validations:
      required: true
