name: Feature request
description: Propose a scoped improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Engineering problem
      description: Describe the use case and why current functionality is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: References and validation data
      description: Link primary sources or reproducible data when the proposal changes a scientific model.
