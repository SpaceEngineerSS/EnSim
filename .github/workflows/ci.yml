name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.6"
      - run: python -m ruff check src tests scripts .github/pyinstaller-hooks main.py
      - run: python -m ruff format --check src tests scripts .github/pyinstaller-hooks main.py

  # The library must work without any GUI package installed.
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the library only
        run: python -m pip install -e . pytest pytest-timeout
      - name: PyQt6 must not be installed
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('PyQt6') is not None)"
      - name: Test
        run: python -m pytest -m "not gui"
      - name: Command line
        run: |
          ensim check
          ensim engine --fuel LCH4 --of 3.4 --pc 100 --eps 35 --json
          ensim run src/ensim/examples/kerolox_sounding_rocket.ensim --flight

  gui:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      ENSIM_DISABLE_3D: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1
      - run: python -m pip install -e ".[gui,dev]"
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    needs: [lint, core, gui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel installs without GUI dependencies
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/ensim check
      - uses: actions/upload-artifact@v4
        with:
          name: ensim-distributions
          path: dist/
          retention-days: 7
