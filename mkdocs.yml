site_name: EnSim
site_url: https://spaceengineerss.github.io/EnSim/
site_author: Mehmet Gümüş
site_description: Liquid rocket engine analysis and six-degree-of-freedom flight simulation
repo_name: SpaceEngineerSS/EnSim
repo_url: https://github.com/SpaceEngineerSS/EnSim
edit_uri: edit/main/docs/
copyright: Mehmet Gümüş · MIT licence

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: paper
      toggle:
        icon: material/weather-night
        name: Dark pages
    - media: "(prefers-color-scheme: dark)"
      scheme: console
      toggle:
        icon: material/weather-sunny
        name: Light pages
  icon:
    repo: material/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/ensim.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 2
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: "#"
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - First session: getting-started/first-session.md
  - Desktop:
      - Engine: desktop/engine.md
      - Vehicle: desktop/vehicle.md
      - Flight: desktop/flight.md
      - Analysis: desktop/analysis.md
  - Library:
      - Python API: library/python.md
      - Command line: library/cli.md
      - Project files: library/project-files.md
  - Theory:
      - Chamber thermochemistry: theory/thermochemistry.md
      - Nozzle expansion: theory/nozzle.md
      - Regenerative cooling: theory/cooling.md
      - Chamber acoustics: theory/acoustics.md
      - Flight dynamics: theory/flight.md
      - Uncertainty: theory/uncertainty.md
  - Validation: validation.md
  - Model limitations: model-limitations.md
  - Reference:
      - ensim.core.engine: reference/engine.md
      - ensim.core.flight_6dof: reference/flight.md
      - ensim.core.propellants: reference/propellants.md
      - ensim.core.monte_carlo: reference/monte_carlo.md
      - ensim.core.staging: reference/staging.md
      - Other modules: reference/other.md
  - Changes:
      - Changelog: changelog.md
      - Moving to 4.0: migrating.md
